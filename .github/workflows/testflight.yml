name: Build & Upload to TestFlight

on:
  push:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: testflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Upload
    runs-on: macos-15

    env:
      SCHEME:            Riot
      WORKSPACE:         Riot.xcworkspace
      CONFIGURATION:     Release
      KEYCHAIN_NAME:     build.keychain
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}

    steps:

      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: false

      - name: Install Fastlane
        run: gem install fastlane

      - name: Install Brew dependencies
        run: brew bundle --no-upgrade

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: Pods
          key: pods-v2-${{ hashFiles('Podfile.lock') }}
          restore-keys: pods-

      - name: XcodeGen
        run: xcodegen generate

      - name: Pod install
        run: pod install --repo-update

      - name: Import signing certificate
        env:
          DIST_CERT_P12_BASE64:    ${{ secrets.DIST_CERT_P12_BASE64 }}
          DIST_CERT_P12_PASSWORD:  ${{ secrets.DIST_CERT_P12_PASSWORD }}
        run: |
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_NAME"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"
          security list-keychains -d user -s "$KEYCHAIN_NAME" ~/Library/Keychains/login.keychain-db
          echo "$DIST_CERT_P12_BASE64" | base64 --decode -o /tmp/dist_cert.p12
          security import /tmp/dist_cert.p12 \
            -k "$KEYCHAIN_NAME" \
            -P "$DIST_CERT_P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/xcodebuild
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_NAME"
          security find-identity -v -p codesigning
          
      - name: Install provisioning profiles
        env:
          PP_MAIN:       ${{ secrets.PP_MAIN }}
          PP_NSE:        ${{ secrets.PP_NSE }}
          PP_SHARE:      ${{ secrets.PP_SHARE }}
          PP_BROADCAST:  ${{ secrets.PP_BROADCAST }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          install_profile() {
            echo "$1" | base64 --decode -o /tmp/pp_tmp.mobileprovision
            UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' /dev/stdin \
              <<< $(security cms -D -i /tmp/pp_tmp.mobileprovision))
            cp /tmp/pp_tmp.mobileprovision \
              ~/Library/MobileDevice/Provisioning\ Profiles/"$UUID".mobileprovision
            echo "Installed: $UUID"
          }
          install_profile "$PP_MAIN"
          install_profile "$PP_NSE"
          install_profile "$PP_SHARE"
          install_profile "$PP_BROADCAST"  
          
      - name: Set build number
        run: agvtool new-version -all ${{ github.run_number }}

      - name: Build & Archive
        run: |
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"
          xcodebuild \
            -workspace Riot.xcworkspace \
            -scheme Riot \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/ElementFork.xcarchive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM=57VK44QF69 \
            OTHER_CODE_SIGN_FLAGS="--keychain $HOME/Library/Keychains/$KEYCHAIN_NAME-db" \
            archive

      - name: Export IPA
        env:
          ASC_KEY_ID:     ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID:  ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_BASE64: ${{ secrets.ASC_KEY_BASE64 }}
        run: |
          echo "$ASC_KEY_BASE64" | base64 --decode -o /tmp/asc_key.p8
          xcodebuild \
            -exportArchive \
            -archivePath build/ElementFork.xcarchive \
            -exportPath build/ElementFork \
            -exportOptionsPlist fastlane/ExportOptions.plist \
            -authenticationKeyPath /tmp/asc_key.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
            
      - name: List export output
        run: ls -la build/ElementFork/
        
      - name: Upload to TestFlight
        env:
          ASC_KEY_ID:     ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID:  ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_BASE64: ${{ secrets.ASC_KEY_BASE64 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_KEY_BASE64" | base64 --decode -o ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          xcrun altool --upload-app \
            --type ios \
            --file build/ElementFork/Element.ipa \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"
      - name: Cleanup keychain
        if: always()
        run: security delete-keychain "$KEYCHAIN_NAME" || true

      - name: Upload archive artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: element-fork-archive-${{ github.run_number }}
          path: build/ElementFork.xcarchive
          retention-days: 7
