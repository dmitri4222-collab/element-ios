name: Build & Upload to TestFlight

on:
  push:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: testflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Upload
    runs-on: macos-15          # Xcode 15, Apple Silicon runner

    env:
      BUNDLE_ID:               org.digital.matrix
      SCHEME:                  Riot
      WORKSPACE:               Riot.xcworkspace
      CONFIGURATION:           Release
      KEYCHAIN_NAME:           build.keychain
      KEYCHAIN_PASSWORD:       ${{ secrets.KEYCHAIN_PASSWORD }}

    steps:

      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
      
      # ── 2. Ruby / Bundler / Fastlane ───────────────────────────────────────
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: false

      - name: Install Fastlane
        run: gem install fastlane

      # ── 3. Brew tools (xcodegen, etc.) ────────────────────────────────────
      - name: Install Brew dependencies
        run: brew bundle --no-upgrade

      # ── 4. CocoaPods cache ────────────────────────────────────────────────
      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: Pods
          key: pods-v2-${{ hashFiles('Podfile.lock') }}
          restore-keys: pods-

      # ── 5. Generate Xcode project ─────────────────────────────────────────
      - name: XcodeGen
        run: xcodegen generate

      # ── 6. Install Pods ───────────────────────────────────────────────────
      - name: Pod install
        run: pod install --repo-update

    # ── 7. Import Distribution Certificate into temp keychain ─────────────
      - name: Import signing certificate
        env:
          DIST_CERT_PEM:       ${{ secrets.DIST_CERT_PEM }}
          DIST_KEY_PEM:        ${{ secrets.DIST_KEY_PEM }}
          DIST_CERT_PASSWORD:  ${{ secrets.DIST_CERT_PASSWORD }}
        run: |
          echo "$DIST_CERT_PEM" > /tmp/dist_cert.pem
          echo "$DIST_KEY_PEM" > /tmp/dist_key.pem
          openssl pkcs12 -export \
            -out /tmp/dist_cert.p12 \
            -inkey /tmp/dist_key.pem \
            -in /tmp/dist_cert.pem \
            -passout pass:$DIST_CERT_PASSWORD
          security import /tmp/dist_cert.p12 \
            -k ~/Library/Keychains/login.keychain-db \
            -P "$DIST_CERT_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/xcodebuild
          security set-key-partition-list -S apple-tool:,apple: -s -k "" ~/Library/Keychains/login.keychain-db
          security find-identity -v -p codesigning

      # ── 8. Install Provisioning Profiles ──────────────────────────────────
      - name: Install provisioning profiles
        env:
          # Each secret is a base64-encoded .mobileprovision file
          PP_MAIN:       ${{ secrets.PP_MAIN }}
          PP_NSE:        ${{ secrets.PP_NSE }}
          PP_SHARE:      ${{ secrets.PP_SHARE }}
          PP_BROADCAST:  ${{ secrets.PP_BROADCAST }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PP_MAIN"      | base64 --decode -o ~/Library/MobileDevice/Provisioning\ Profiles/main.mobileprovision
          echo "$PP_NSE"       | base64 --decode -o ~/Library/MobileDevice/Provisioning\ Profiles/nse.mobileprovision
          echo "$PP_SHARE"     | base64 --decode -o ~/Library/MobileDevice/Provisioning\ Profiles/share.mobileprovision
          echo "$PP_BROADCAST" | base64 --decode -o ~/Library/MobileDevice/Provisioning\ Profiles/broadcast.mobileprovision

      # ── 9. Increment build number (= GitHub run number) ───────────────────
      - name: Set build number
        run: |
          agvtool new-version -all ${{ github.run_number }}

      # ── 10. Build & Archive via Fastlane ──────────────────────────────────
      - name: Build & Archive
        run: |
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"
          xcodebuild \
            -workspace Riot.xcworkspace \
            -scheme Riot \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/ElementFork.xcarchive \
            CODE_SIGN_STYLE=Manual \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_NAME" \
            archive

      - name: Export IPA
        env:
          ASC_KEY_ID:     ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID:  ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_BASE64: ${{ secrets.ASC_KEY_BASE64 }}
        run: |
          echo "$ASC_KEY_BASE64" | base64 --decode -o /tmp/asc_key.p8
          xcodebuild \
            -exportArchive \
            -archivePath build/ElementFork.xcarchive \
            -exportPath build/ElementFork \
            -exportOptionsPlist fastlane/ExportOptions.plist \
            -authenticationKeyPath /tmp/asc_key.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Upload to TestFlight
        if: ${{ env.ASC_KEY_ID != '' }}
        env:
          ASC_KEY_ID:     ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID:  ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_BASE64: ${{ secrets.ASC_KEY_BASE64 }}
        run: |
          echo "$ASC_KEY_BASE64" | base64 --decode -o /tmp/asc_key.p8
          xcrun altool --upload-app \
            --type ios \
            --file build/ElementFork/ElementFork.ipa \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID" \
            --privateKeyPath /tmp/asc_key.p8

      # ── 11. Cleanup keychain ───────────────────────────────────────────────
      - name: Cleanup keychain
        if: always()
        run: security delete-keychain "$KEYCHAIN_NAME" || true

      # ── 12. Upload .xcarchive as artifact (optional, for debugging) ────────
      - name: Upload archive artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: element-fork-archive-${{ github.run_number }}
          path: build/ElementFork.xcarchive
          retention-days: 7
